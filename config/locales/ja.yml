# 日本語の翻訳設定
ja:
  # Bookモデルのenumの表示名を定義
  enums:
    book:
      # reading_statusの表示名
      reading_status:
        unread: "未読"
        reading: "読書中"
        finished: "読了"

      # acquisition_typeの表示名
      acquisition_type:
        not_owned: "未入手"
        purchase: "購入"
        borrowed: "借りた"

  activerecord:
    attributes:
      book:
        title: "タイトル"
        author: "著者"
        reading_status: "読書状況"
        started_on: "開始日"
        finished_on: "終了日"
        memo: "メモ"

  errors:
    format: "%{attribute}%{message}"

    messages:
      invalid: "が正しくありません"
      blank: "を入力してください"
      too_long: "は%{count}文字以下で入力してください"
