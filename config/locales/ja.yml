# 日本語の翻訳設定
ja:
  # Bookモデルのenumの表示名を定義
  enums:
    book:
      # reading_statusの表示名
      reading_status:
        unread: "未読"
        reading: "読書中"
        finished: "読了"

      # acquisition_typeの表示名
      acquisition_type:
        not_owned: "未入手"
        purchase: "購入"
        borrowed: "借りた"

  # 日本語表示設定
  activerecord:
    # モデルの属性名を日本語で表示
    attributes:
      book:
        title: "タイトル"
        author: "著者"
        reading_status: "読書状況"
        acquisition_type: "入手方法"
        started_on: "開始日"
        finished_on: "終了日"
        memo: "メモ"

      user:
        email: "メールアドレス"
        password: "パスワード"
        password_confirmation: "パスワード(確認用)"

  # バリデーションエラーメッセージの設定
  errors:
    # エラーメッセージの表示形式（項目名 + メッセージ）
    format: "%{attribute}%{message}"

    # 各バリデーションの日本語メッセージ
    messages:
      invalid: "が正しくありません"
      blank: "を入力してください"
      too_long: "は%{count}文字以下で入力してください"
      too_short: "は%{count}文字以上で入力してください"
      taken: "はすでに登録されています"
      confirmation: "が一致しません"
